<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker - Signup</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .signup-container {
            width: 100%;
            padding: 30px;
        }

        form {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        label {
            font-weight: bold;
        }

        input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 9px 18px;
            border: none;
            border-radius: 4px;
            background: #6c5ce7;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #5849c4;
        }

        .login {
            margin-top: 20px;
        }

        .login a {
            color: #6c5ce7;
            text-decoration: none;
        }

        @media (max-width: 768px) {
            form {
                flex-direction: column;
                align-items: flex-start;
            }

            input {
                width: 100%;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="signup-container">

        <form id="signupForm">

            <label for="name">
                Enter your name:
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >

            <label for="email">
                Enter your email:
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">
                Enter your password:
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Signup
            </button>

        </form>

        <div class="login">
            <a href="#">
                Existing User - Login
            </a>
        </div>

    </div>

    <script>
        document
            .getElementById("signupForm")
            .addEventListener("submit", async function (event) {

                event.preventDefault();

                const name =
                    document.getElementById("name").value.trim();

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value.trim();

                try {
                    const response = await fetch(
                        "http://localhost:3000/signup",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                name: name,
                                email: email,
                                password: password
                            })
                        }
                    );

                    const data = await response.json();

                    if (!response.ok) {
                        alert(data.message);
                        return;
                    }

                    alert(data.message);

                    document
                        .getElementById("signupForm")
                        .reset();

                } catch (error) {
                    console.log(error);
                    alert("Network Error");
                }
            });
    </script>

</body>
</html>
